<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>BDS Auto Poster</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #10b981;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0f172a;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #10b981;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #10b981;
      border: none;
      border-radius: 8px;
      color: #0f172a;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #059669;
      color: #fff;
    }
    .hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <div class="title">BĐS Auto Poster v1.0</div>
  </div>

  <div class="status-badge status-online">
    <div class="status-dot"></div>
    <span id="status-text">Đang kết nối trạm đăng bài...</span>
  </div>

  <div class="form-group">
    <label>Địa chỉ Máy chủ (Server API):</label>
    <input type="text" id="server-url" value="http://localhost:3001" placeholder="http://localhost:3001 hoặc https://bds-api.onrender.com" />
  </div>

  <div class="form-group">
    <label>Mã tài khoản (User Token / Client Key):</label>
    <input type="text" id="client-key" value="demo-user-01" placeholder="Nhập mã token tài khoản của bạn" />
  </div>

  <button id="save-btn">Lưu Cấu Hình</button>

  <div class="hint">
    * Tiện ích sẽ tự động đồng bộ lịch đăng từ Web và tự động đăng bài bằng nick Facebook đang mở trên máy tính của bạn.
  </div>

  <script src="popup.js"></script>
</body>
</html>
